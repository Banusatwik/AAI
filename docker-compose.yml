services:
  postgres:
    image: postgres:16-alpine
    container_name: mech_safety_postgres
    environment:
      POSTGRES_USER: mech_user
      POSTGRES_PASSWORD: mech_password
      POSTGRES_DB: mechanical_safety_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mech_user -d mechanical_safety_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mech_safety_backend
    environment:
      DATABASE_URL: postgresql://mech_user:mech_password@postgres:5432/mechanical_safety_db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: mech_safety_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
